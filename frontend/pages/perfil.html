<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - StudentHub</title>
</head>
<body>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="materias.html">Materias</a>
        <a href="horario.html">Horario</a>
        <a href="tareas.html">Tareas</a>
        <a href="notas.html">Notas</a>
        <a href="perfil.html">Perfil</a>
        <button id="btn-logout" type="button">Cerrar sesión</button>
    </nav>

    <main>
        <h1>Perfil</h1>

        <section>
            <h2>Editar información</h2>

            <form id="form-perfil">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <button type="submit">Guardar cambios</button>
            </form>

            <p id="mensaje-perfil"></p>
        </section>

        <section>
            <h2>Cambiar contraseña</h2>

            <form id="form-contrasena">
                <label for="contrasena_actual">Contraseña actual</label>
                <input type="password" id="contrasena_actual" name="contrasena_actual" required>

                <label for="contrasena_nueva">Nueva contraseña</label>
                <input type="password" id="contrasena_nueva" name="contrasena_nueva" required>

                <label for="confirmar_contrasena_nueva">Confirmar nueva contraseña</label>
                <input type="password" id="confirmar_contrasena_nueva" name="confirmar_contrasena_nueva" required>

                <button type="submit">Cambiar contraseña</button>
            </form>

            <p id="mensaje-contrasena"></p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
