<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudentHub</title>

    <script>
        (function () {
            if (localStorage.getItem('studenthub_tema') === 'claro') {
                document.documentElement.setAttribute('data-theme', 'claro');
            }
        })();
    </script>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="materias.html">Materias</a>
        <a href="horario.html">Horario</a>
        <a href="tareas.html">Tareas</a>
        <a href="notas.html">Notas</a>
        <a href="perfil.html">Perfil</a>
        <button id="btn-tema" type="button" class="interruptor-tema" aria-pressed="false" aria-label="Cambiar a modo claro">
            <span class="interruptor-tema-icono interruptor-tema-icono-luna" aria-hidden="true">&#9790;</span>
            <span class="interruptor-tema-icono interruptor-tema-icono-sol" aria-hidden="true">&#9728;</span>
            <span class="interruptor-tema-knob"></span>
        </button>
        <button id="btn-logout" type="button">Cerrar sesión</button>
    </nav>

    <main>
        <h1>Panel principal</h1>

        <section>
            <h2>Materias</h2>
            <div id="resumen-materias">Cargando...</div>
        </section>

        <section>
            <h2>Tareas próximas</h2>
            <div id="resumen-tareas">Cargando...</div>
        </section>

        <section>
            <h2>Horario de hoy</h2>
            <div id="resumen-horario">Cargando...</div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
